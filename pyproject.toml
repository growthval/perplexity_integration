[project]
name = "perplexity-integrations"
version = "0.1.0"
description = "Web-grounded answers (Agent API) and programmatic web search (Search API) via Perplexity"
requires-python = ">=3.10"
dependencies = [
    "perplexityai>=0.43.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
perplexity-agent = "perplexity_agent.cli:main"
perplexity-search = "perplexity_search.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-m \"not integration\""
markers = [
    "integration: hits the real Perplexity API; requires PERPLEXITY_API_KEY and network access",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
